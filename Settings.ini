[DLNA]
LANAddress = Auto
ServerName = CODEX DLNA Server
HTTPPort = 8200
AutoAdvertise = True

[PlaybackTracking]
Enabled = True
UpdateIntervalSeconds = 60
ResumeOffsetSeconds = 60
TrackPerDevice = True

[MediaLibrary]
RecursiveScan = True
RefreshOnStartup = True

[Logging]
Enabled = True
LogConnections = True
LogPlaybackActivity = True
LogErrors = True

[Firewall]
CheckOnStartup = True
PromptToConfigure = True
Profile = Private
RestrictToLocalSubnet = True

[DesktopStreaming]
Enabled = True
CaptureDisplay = 0
Encoder = Auto
IncludeSystemAudio = False
IncludeMouseCursor = True
StartOnClientRequest = True
StopWhenIdle = True
IdleTimeoutSeconds = 30
FFmpegPath = C:\Program Files\Virtual Desktop Streamer\ffmpeg.exe

ClientBufferMilliseconds = 250
ClientStartupGraceSeconds = 5
SlowClientTimeoutSeconds = 3

[DesktopProfile]
Resolution = 1920x1080
FPS = 30
BitrateMbps = 6

[HighQualityProfile]
Resolution = 1920x1080
FPS = 30
BitrateMbps = 8

[GamingProfile]
Resolution = 1920x1080
FPS = 60
BitrateMbps = 20
LowLatency = True

[LowLatencyProfile]
Resolution = 1280x720
FPS = 30
BitrateMbps = 4
